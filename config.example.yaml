# Example lok configuration.
#
# Copy to `config.yaml` and replace every REPLACE-ME. `config.yaml` is
# deliberately untracked and excluded from the Docker image: it previously
# shipped a real OIDC signing key and SECRET_KEY, which meant anyone with the
# repo could forge a token for any user of any deployment that booted without
# mounting its own config.
#
# Generate the signing keypair with:
#   openssl genrsa -out lok.pem 2048
#   ssh-keygen -y -f lok.pem          # the matching ssh-rsa public key
#
deployment:
  name: default
  # URL the fakts well-known advertises as its `configure` endpoint. `{code}` is
  # substituted by the client. Absolute (with scheme or a bare host) is used as-is;
  # a `/`-relative path resolves against the deployment's base domain. The
  # well-known always advertises the resolved absolute URL.
  configure_url: go.arkitekt.live/configure/{code}
django:
  admin:
    email: admin@admin.com
    password: REPLACE-ME
    username: admin
  debug: false
  hosts:
  - "*"
  secret_key: REPLACE-ME-WITH-A-RANDOM-64-HEX-STRING
  csrf_trusted_origins:
  - http://localhost
  - https://localhost
  force_script_name: lok
  language_code: en-us
  time_zone: UTC
  log_level: INFO
  secure_proxy_ssl_header: true
