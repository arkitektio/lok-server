# Test-only configuration for the suite. Committed on purpose.
#
# lok's `config.yaml` is the default config source and is deliberately
# untracked -- it was removed from git in e45feb1 because it shipped a real
# OIDC signing key. Nothing replaced it for the tests, so `Settings()` has
# raised 6 missing-field errors at import ever since and the whole suite has
# been red. `settings_test` points ARKITEKT_CONFIG_FILE here instead.
#
# The key material below is a throwaway keypair generated for this file alone.
# It signs nothing outside the test run, and its digests deliberately do not
# match the ones `_refuse_committed_key_material_in_production` refuses -- the
# suite must exercise that guard's happy path, not bypass it with
# LOK_ALLOW_COMMITTED_KEYS.
account:
  email_verification: none
  login_by_code_enabled: true
  login_methods:
  - username
  mfa_trust_enabled: true
  social_provider_apps:
  - allauth.socialaccount.providers.orcid
  - allauth.socialaccount.providers.google
  - allauth.socialaccount.providers.saml
authentikate:
  audience: '*'
  issuers:
  - iss: lok
    kid: lok-key-1
    kind: rsa
    public_key: ssh-rsa 
  static_tokens: {}
datalayer:
  access_key: lok_access_key
  default_acl: private
  file_overwrite: false
  host: localhost
  media:
    bucket: media
  port: 9000
  protocol: http
  querystring_expire: 3600
  secret_key: lok_secret_key
deployment:
  configure_url: go.arkitekt.live/configure/{code}
  name: default
django:
  admin:
    email: admin@admin.com
    password: test-admin-password
    username: admin
  csrf_trusted_origins:
  - http://localhost
  - https://localhost
  debug: true
  force_script_name: lok
  hosts:
  - '*'
  language_code: en-us
  log_level: INFO
  secret_key: test-only-secret-key-0000000000000000000000000000000000000000000
  secure_proxy_ssl_header: true
  time_zone: UTC
lok:
  public_key: ssh-rsa 
openid_apps:
- client_id: lok-frontend
  client_name: Lok Frontend
  client_secret: change-me-per-deployment
  redirect_uris:
  - http://localhost:3000/auth/callback
organizations:
- identifier: default
  name: Default
postgres:
  db_name: testdb
  dependency: db
  engine: django.db.backends.postgresql
  host: localhost
  password: test
  port: 5432
  username: test
privacy_guards: opt-in
